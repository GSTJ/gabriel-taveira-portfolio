# pnpm 11 stopped reading the `pnpm` field in package.json. Settings live here
# now, so this is where the transitive-dependency pins moved to — same list,
# same meaning, and renovate.json still matches them via the pnpm.overrides
# depType.
overrides:
  "@babel/core": ^7.29.6
  "ajv@6": ^6.14.0
  "brace-expansion@1": ^1.1.16
  "brace-expansion@2": ^2.1.2
  "brace-expansion@5": ^5.0.8
  flatted: ^3.4.2
  postcss: ^8.5.18
  "js-yaml@3": ^3.15.0
  "js-yaml@4": ^4.3.0
  lodash: ^4.18.0
  "minimatch@3": ^3.1.3
  "minimatch@9": ^9.0.7
  "picomatch@2": ^2.3.2
  sharp: ^0.35.0
  ws: ^8.21.0

# pnpm 8 ran every postinstall script; pnpm 11 blocks them until they are named
# here. All five ran before this migration and all five have to keep running:
# puppeteer downloads the Chrome that `pnpm run get:pdf` drives, workerd is the
# wrangler runtime, and the other three ship native binaries.
allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true
  puppeteer: true
  workerd: true

# pnpm 11 quarantines releases younger than its default minimum age. These were
# published for this migration, so they are exempt by version.
minimumReleaseAgeExclude:
  - eslint-plugin-safe-jsx@1.3.0
  - magic-codemods@1.0.0
  - magic-oxfmt-config@1.0.0
  - magic-oxlint-config@1.0.0
  - magic-tsconfig@1.0.0
