name: Generate static files

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "scripts/**"
      - "public/**"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # Needed to start ci.yml on the asset branch, see the step that does it.
  actions: write

# Two overlapping runs would fight over the same asset branch.
concurrency:
  group: generate-files
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Setup Repo
        uses: actions/checkout@v7

      - name: 🏗 Setup PNPM
        uses: pnpm/action-setup@v6

      # We cannot cache the same fast way here, as it actually needs
      # to install puppeteer stuff on the machine each time.
      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗 Install ghostscript
        run: sudo apt-get update && sudo apt-get install -y ghostscript

      - name: 🖨️ Generate PDF
        run: pnpm run get:pdf

      - name: 🤖 Capture the site GIF
        uses: PabloLec/website-to-gif@2.1.5
        with:
          url: "https://www.gabrieltaveira.dev"

      # main requires the `verify` check, so these assets land through a PR
      # instead of a direct push. add-paths keeps everything else the render
      # touches out of the commit.
      - name: 📤 Open the asset PR
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          base: main
          branch: chore/regenerate-static-files
          add-paths: |
            demo.gif
            public/curriculum.pdf
          commit-message: "chore: update the website pdf and gif 💾"
          title: "chore: update the website pdf and gif 💾"
          body: |
            Regenerated `public/curriculum.pdf` from the live site and
            recaptured `demo.gif`. Opened by the `Generate static files`
            workflow and set to auto-merge once `verify` passes.
          author: Gabriel Taveira <action@github.com>
          committer: Gabriel Taveira <action@github.com>
          delete-branch: true

      # A PR opened with GITHUB_TOKEN parks its `pull_request` run at
      # action_required, so `verify` never reports and auto-merge waits
      # forever. Approving the parked run is what releases it. Dispatching
      # ci.yml on the branch does not work here: the check it produces isn't
      # attached to the PR, so the required check stays unsatisfied.
      - name: 🔍 Release the PR's CI run
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.cpr.outputs.pull-request-head-sha }}
        run: |
          for _ in $(seq 1 20); do
            id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=pull_request&head_sha=$SHA" \
              --jq '[.workflow_runs[] | select(.conclusion == "action_required")][0].id')
            if [ -n "$id" ] && [ "$id" != "null" ]; then
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/approve"
              echo "approved run $id"
              exit 0
            fi
            sleep 6
          done
          echo "::warning::no parked pull_request run for $SHA, check whether $SHA got a verify run"

      - name: 🚀 Queue auto-merge
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge ${{ steps.cpr.outputs.pull-request-number }} --auto --squash
