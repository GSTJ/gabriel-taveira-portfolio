name: Generate static files

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/generate-files.yml"
      - "next.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "postcss.config.js"
      - "public/**"
      - "scripts/**"
      - "src/**"
      - "tsconfig.json"
      - "vercel.json"
  workflow_dispatch:

# Two overlapping runs would race each other writing the same two objects.
concurrency:
  group: generate-files
  cancel-in-progress: false

env:
  R2_BUCKET: portfolio-assets
  ASSETS_BASE_URL: https://assets.gabrieltaveira.dev
  # There is no cache purge in this setup, so an object's max-age is the whole
  # freshness story after a regeneration. An hour is the ask.
  #
  # Measured, not assumed: the zone's Browser Cache TTL is 4 hours and raises
  # anything lower, so browsers are told 14400 whatever this says (asking for
  # 3600, 7200 and 60 all came back as 14400, while 21600 passed through).
  # Setting the zone to "Respect Existing Headers" would make this value the
  # real one, but that is a zone-wide change and affects the site too.
  ASSET_CACHE_CONTROL: "public, max-age=3600"

jobs:
  generate:
    runs-on: ubuntu-latest
    # Browser automation and the third-party capture action stay in this job.
    # R2 credentials only exist in the separate upload job below.
    permissions:
      contents: read
      deployments: read
    env:
      # Ubuntu's AppArmor policy allows its packaged Chrome to create the user
      # namespace used by the browser sandbox. Puppeteer's downloaded Chrome
      # for Testing is outside that profile on Ubuntu 23.10 and newer.
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - name: ✅ Require main for manual runs
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Choose main when running this workflow manually. Production deployments only exist for main commits."
            exit 1
          fi

      - name: 🏗 Setup Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🏗 Setup PNPM
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      # We cannot cache the same fast way here, as it actually needs
      # to install puppeteer stuff on the machine each time.
      - name: 🏗 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      # Capture the deployment for this exact commit. The workflow used to read
      # the public site immediately and could publish assets from the previous
      # deployment when Actions won the race against Vercel.
      - name: 🚀 Wait for this commit's production deployment
        id: production
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          found=false
          for attempt in $(seq 1 60); do
            deployment_id=$(gh api \
              "repos/$GITHUB_REPOSITORY/deployments?sha=$GITHUB_SHA&environment=Production&per_page=10" \
              --jq '.[0].id // empty')

            if [ -z "$deployment_id" ]; then
              echo "attempt $attempt: production deployment has not started"
              sleep 10
              continue
            fi

            deployment_status=$(gh api \
              "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" \
              --jq '.[0].state // empty')

            if [ "$deployment_status" = "success" ]; then
              deployment_url=$(gh api \
                "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" \
                --jq '.[0].environment_url // empty')

              if [ -z "$deployment_url" ]; then
                echo "::error::Production deployment $deployment_id has no URL"
                exit 1
              fi

              echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
              echo "deployment=$deployment_id" >> "$GITHUB_OUTPUT"
              echo "using production deployment $deployment_id at $deployment_url"
              found=true
              break
            fi

            case "$deployment_status" in
              failure|error|inactive)
                echo "::error::Production deployment $deployment_id concluded with $deployment_status"
                exit 1
                ;;
            esac

            echo "attempt $attempt: production deployment $deployment_id is $deployment_status"
            sleep 10
          done

          if [ "$found" != "true" ]; then
            echo "::error::Timed out waiting for a successful production deployment of $GITHUB_SHA"
            exit 1
          fi

      - name: 🏗 Install ghostscript
        run: sudo apt-get update && sudo apt-get install -y ghostscript

      - name: 🖨️ Generate PDF
        env:
          PDF_SOURCE_URL: ${{ steps.production.outputs.url }}/en-US
        run: pnpm run get:pdf

      - name: 🤖 Capture the site GIF
        uses: PabloLec/website-to-gif@44056271a60cc6748fdfc990633a51bcb124a2cb # 2.1.5
        with:
          url: ${{ steps.production.outputs.url }}/en-US

      - name: ✅ Validate generated assets
        run: |
          set -euo pipefail

          [ "$(file --brief --mime-type demo.gif)" = "image/gif" ]
          [ "$(file --brief --mime-type public/curriculum.pdf)" = "application/pdf" ]
          [ -s demo.gif ]
          [ -s public/curriculum.pdf ]

          sha256sum demo.gif public/curriculum.pdf

      - name: 📦 Store generated assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portfolio-static-assets-${{ github.sha }}
          path: |
            demo.gif
            public/curriculum.pdf
          if-no-files-found: error
          retention-days: 1

  upload:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 🏗 Setup Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🏗 Setup PNPM
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x

      # The upload job only needs Wrangler. Skipping lifecycle scripts keeps
      # the clean credentialed runner from executing unrelated package hooks.
      - name: 📦 Install publishing dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 📦 Restore generated assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: portfolio-static-assets-${{ github.sha }}

      # Fail before the upload instead of hiding the cause in a Wrangler stack
      # trace. A listed secret can still contain an empty value.
      - name: 🔑 Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          empty=""
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || empty="$empty CLOUDFLARE_API_TOKEN"
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || empty="$empty CLOUDFLARE_ACCOUNT_ID"

          if [ -n "$empty" ]; then
            echo "::error::Repository secret(s) unset or set to an empty value:$empty. Re-save each value and give the token Account > R2 > Edit on the account that owns $R2_BUCKET."
            exit 1
          fi

          if ! pnpm exec wrangler r2 bucket info "$R2_BUCKET"; then
            echo "::error::The Cloudflare credentials cannot read $R2_BUCKET. Check the account id and the token's R2 permissions."
            exit 1
          fi

          echo "credentials reach $R2_BUCKET"

      # Straight to R2, no commit and no branch. Both objects are overwritten in
      # place and served from the custom domain, which README links to directly.
      # `curriculum.pdf` also reaches the site's own origin through
      # `src/app/curriculum.pdf/route.ts`, which refetches it from here and
      # re-emits the bytes under a Content-Type pinned in code. It used to be a
      # `next.config.ts` rewrite, and a rewrite forwards the upstream
      # Content-Type, which handed whoever can write this object the power to
      # decide what gabrieltaveira.dev serves.
      #
      # --remote is not optional. Without it wrangler v4 writes to a local
      # simulation on the runner, reports success, and uploads nothing.
      - name: ☁️ Upload to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          pnpm exec wrangler r2 object put "$R2_BUCKET/demo.gif" \
            --remote \
            --file demo.gif \
            --content-type "image/gif" \
            --cache-control "$ASSET_CACHE_CONTROL"

          pnpm exec wrangler r2 object put "$R2_BUCKET/curriculum.pdf" \
            --remote \
            --file public/curriculum.pdf \
            --content-type "application/pdf" \
            --content-disposition 'inline; filename="gabriel-taveira.pdf"' \
            --cache-control "$ASSET_CACHE_CONTROL"

      # wrangler reporting "Upload complete" is not evidence, and neither is a
      # 200. Read the objects back over HTTPS from the custom domain and check
      # the bytes match what was just built.
      - name: ✅ Verify what the custom domain serves
        run: |
          set -euo pipefail

          check() {
            local key="$1" local_file="$2" want_type="$3"
            local url="$ASSETS_BASE_URL/$key?ci=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

            curl --silent --show-error --fail --location "$url" --output "served-$key"

            local got_type
            got_type=$(curl --silent --show-error --fail --location --head "$url" \
              | tr -d '\r' | awk -F': ' 'tolower($1)=="content-type" {print $2}')

            local want_sum got_sum
            want_sum=$(sha256sum "$local_file" | cut -d' ' -f1)
            got_sum=$(sha256sum "served-$key" | cut -d' ' -f1)

            echo "$key: content-type=$got_type sha256=$got_sum"

            if [ "$got_type" != "$want_type" ]; then
              echo "::error::$key came back as '$got_type', expected '$want_type'"
              exit 1
            fi

            if [ "$want_sum" != "$got_sum" ]; then
              echo "::error::$key served $got_sum but this run built $want_sum"
              exit 1
            fi
          }

          # The cache-busting query is deliberate. Cloudflare caches responses
          # from an R2 custom domain, including 404s from before an object
          # existed, so the bare URL can lag a fresh upload.
          check demo.gif demo.gif "image/gif"
          check curriculum.pdf public/curriculum.pdf "application/pdf"

          echo "both objects match the ones this run built"
