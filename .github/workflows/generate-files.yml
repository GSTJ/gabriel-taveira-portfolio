name: Generate static files

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "scripts/**"
  workflow_dispatch:

# Two overlapping runs would fight over the same force-pushed branch.
concurrency:
  group: generate-files
  cancel-in-progress: false

env:
  ASSETS_BRANCH: assets

jobs:
  generate:
    runs-on: ubuntu-latest
    # Pushing the assets branch is the only write this job makes. It shares the
    # runner with third-party actions, so it gets nothing else.
    permissions:
      contents: write
    steps:
      - name: 🏗 Setup Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🏗 Setup PNPM
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      # We cannot cache the same fast way here, as it actually needs
      # to install puppeteer stuff on the machine each time.
      - name: 🏗 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗 Install ghostscript
        run: sudo apt-get update && sudo apt-get install -y ghostscript

      - name: 🖨️ Generate PDF
        run: pnpm run get:pdf

      # Pinned by digest, not by tag. This is the smallest and least audited
      # action in the repo and it runs on a job that can push, so a retagged
      # 2.1.5 must not silently become a different container.
      - name: 🤖 Capture the site GIF
        uses: PabloLec/website-to-gif@44056271a60cc6748fdfc990633a51bcb124a2cb # 2.1.5
        with:
          url: "https://www.gabrieltaveira.dev"

      # Neither asset is committed to main. The GIF is a few megabytes, the PDF
      # is regenerated on every content change, and committing them buries
      # main's history under binary churn while making every regeneration
      # negotiate the `verify` requirement on main.
      #
      # So they go to a single-commit orphan branch, force-pushed, which drops
      # the previous blobs out of reach instead of stacking them up. README
      # points at the GIF's raw URL and the site proxies the PDF through
      # `src/app/curriculum.pdf/route.ts`.
      #
      # This step is the publishing half of that pair. Moving the assets to R2
      # or any other host means replacing the git push below and pointing
      # `ASSETS_ORIGIN` (read in the route handler) at the new host. README's
      # `<img src>` is the third and last reference.
      #
      # Nothing watches this branch. Every workflow here triggers on `main`
      # only, so the push cannot loop back into another generation run. A
      # `deletion` ruleset guards the branch, and it deliberately has no
      # `non_fast_forward` rule because this step force-pushes.
      - name: 📤 Publish to the assets branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          out="$RUNNER_TEMP/$ASSETS_BRANCH"
          mkdir -p "$out"
          cp demo.gif "$out/demo.gif"
          cp public/curriculum.pdf "$out/curriculum.pdf"

          cd "$out"
          git init --quiet --initial-branch "$ASSETS_BRANCH"
          git config user.name "Gabriel Taveira"
          git config user.email "action@github.com"
          git add demo.gif curriculum.pdf
          git commit --quiet \
            --message "chore: publish the generated pdf and gif 💾" \
            --message "Captured from $GITHUB_SHA by the Generate static files workflow."
          git push --quiet --force \
            "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" \
            "$ASSETS_BRANCH"
