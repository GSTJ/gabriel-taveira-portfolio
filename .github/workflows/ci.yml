name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # For re-running verify by hand without pushing anything.
  workflow_dispatch:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `verify` is the required status check on main (ruleset 2437718). Renaming the
  # job, or moving these steps into GSTJ/magic's reusable ci.yml, changes the
  # reported context name and blocks every PR on a check that no longer exists.
  #
  # The reusable workflow is the other reason this stays local: every action here
  # is pinned by commit digest and renovate keeps them that way, which it can
  # only do for workflow files in this repo. GSTJ/magic's ci.yml pins by tag.
  verify:
    runs-on: ubuntu-latest
    # Workflow permissions default to read for the repo; this states the grant
    # rather than relying on that default staying put.
    permissions:
      contents: read
    steps:
      - name: 🏗 Setup Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🏗 Setup PNPM
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: pnpm

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🧹 Lint
        run: pnpm run lint

      - name: 💅 Format
        run: pnpm run format

      - name: 🔍 Typecheck
        run: pnpm run typecheck

      - name: 🏗 Build
        run: pnpm run build
