name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # For re-running verify by hand without pushing anything.
  workflow_dispatch:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkup:
    # Install, build, lint, format and typecheck all come from the shared
    # workflow, so this repo stops carrying its own copy of the steps.
    uses: GSTJ/magic/.github/workflows/ci.yml@2e465451c4b72b7e85f008e06a477dd34e3d65b1 # main
    # A called workflow cannot exceed the caller's grant, and this one only
    # reads the tree.
    permissions:
      contents: read
    with:
      node-version: "24"
      build-command: pnpm run build
      # No turbo here, so the cache proxy would just be a step that does
      # nothing. There is no test suite yet either; the reusable workflow skips
      # the step when the command is empty, which is the default.
      turbo-cache: false

  # main's ruleset requires a status check named exactly `verify`, and a called
  # workflow reports as `<caller job> / <called job>` — the reusable workflow
  # can never produce that name on its own. This job carries it.
  #
  # `if: always()` plus the explicit result check is load-bearing: without it a
  # failing `checkup` leaves this skipped, and GitHub counts a skipped required
  # check as satisfied.
  verify:
    needs: checkup
    if: always()
    runs-on: ubuntu-latest
    # The repo hands workflows a write token by default and this one only reads.
    permissions:
      contents: read
    steps:
      - name: ✅ Checkup result
        run: |
          echo "checkup concluded: ${{ needs.checkup.result }}"
          [ "${{ needs.checkup.result }}" = "success" ]
